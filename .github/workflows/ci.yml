name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          swift --version
      - run: swift build
      - run: swift test
        env:
          # Hosted runners have no on-device speech models, so the tests that talk to the
          # Speech framework are skipped here — declared, not automatic. Locally they
          # always run, and they are the ones that prove transcription really works.
          AMBAR_SKIP_SPEECH_TESTS: '1'
      - run: ./Scripts/check-localization.sh
